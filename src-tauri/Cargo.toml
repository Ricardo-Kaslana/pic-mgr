[package]
name = "pic-mgr"
version = "0.3.16"
edition = "2021"
description = "A lightweight, local-first image manager built with Tauri 2 and Vue 3."
license = "MIT"
authors = ["Dawn.Wang"]
repository = "https://github.com/Ricardo-Kaslana/pic-mgr"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
image = "0.25"
sha2 = "0.10"
trash = "5"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "pic_mgr_lib"

crate-type = ["lib", "cdylib", "staticlib"]
